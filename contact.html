<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Learn GitHub</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <!-- NAVBAR -->

    <nav>
        <div class="logo">
            Learn<span>GitHub</span>
        </div>

        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./projects.html">Projects</a>
            <a href="./contact.html">Contact</a>
        </div>
    </nav>


    <!-- CONTACT -->

    <section class="section">

        <p class="small-title">GET IN TOUCH</p>

        <h1>Let's Connect 👋</h1>

        <p>
            Punya pertanyaan, ide, atau sekadar ingin menyapa?
            Kirim pesan melalui form di bawah.
        </p>


        <form class="contact-form">

            <label for="name">Nama</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Masukkan nama kamu"
                required
            >


            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="nama@email.com"
                required
            >


            <label for="message">Pesan</label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Tulis pesan kamu..."
                required
            ></textarea>


            <button type="submit" class="button">
                Send Message 🚀
            </button>

        </form>

    </section>


    <footer>
        <p>Built with ❤️ and GitHub Pages</p>
    </footer>

</body>

</html>
